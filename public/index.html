<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  
 <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink950: "#0b1026",
          ink800: "#1e1b4b",
          ink600: "#4c1d95",
          paper: "#fdfcf8",
          paperShade: "#ece4d0",
          gold: "#d9a72f",
          goldDark: "#b9841f",
          coral: "#ef4444",
          textDark: "#1f2333",
          textMuted: "#6b6f85",
        },
        fontFamily: {
          display: ["Fraunces", "Georgia", "serif"],
          body: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          mono: ['"JetBrains Mono"', '"Courier New"', "monospace"],
        },
        backgroundImage: {
          "app-gradient":
            "radial-gradient(circle at 15% 0%, rgba(217,167,47,0.12), transparent 40%), linear-gradient(160deg, #0b1026 0%, #1e1b4b 55%, #4c1d95 100%)",
        },
        keyframes: {
          cardIn: { "0%": { opacity: 0, transform: "translateY(10px) scale(0.98)" }, "100%": { opacity: 1, transform: "translateY(0) scale(1)" } },
          fadeIn: { "0%": { opacity: 0 }, "100%": { opacity: 1 } },
          modalPop: { "0%": { opacity: 0, transform: "scale(0.95) translateY(8px)" }, "100%": { opacity: 1, transform: "scale(1) translateY(0)" } },
        },
        animation: {
          "card-in": "cardIn 0.35s ease both",
          "fade-in": "fadeIn 0.2s ease",
          "modal-pop": "modalPop 0.22s ease",
        },
      },
    },
  };
</script>
  </head>
  </body>
</html>
